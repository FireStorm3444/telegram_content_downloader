[project]
name = "tg-downloader"
version = "0.1.0"
description = "High-Performance Telegram Media Downloader CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Autonomous Systems Engineer" }
]
dependencies = [
    "telethon>=1.36.0",
    "cryptg>=0.4.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "aiofiles>=23.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tg-downloader = "tg_downloader.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tg_downloader*"]
exclude = ["downloads*", "tests*"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by ruff format
    "N818", # exception names
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"
python = ".venv/bin/python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
